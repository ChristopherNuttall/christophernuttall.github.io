<h2>Map of Talks</h2>
<div id="talks-map" style="height: 500px; margin-bottom: 2em;"></div>

{% for post in site.talks reversed %}
  {% include archive-single-talk.html %}
{% endfor %}

<!-- Leaflet CSS -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
/>

<!-- Leaflet JS -->
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var map = L.map("talks-map").setView([40, 15], 5); // Centre over Europe

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);

    var markers = [
      {% assign has_marker = false %}
      {% for post in site.talks %}
        {% if post.latitude and post.longitude %}
          {% if has_marker %},{% endif %}
          {
            title: {{ post.title | jsonify }},
            lat: {{ post.latitude }},
            lon: {{ post.longitude }},
            url: {{ post.url | jsonify }}
          }
          {% assign has_marker = true %}
        {% endif %}
      {% endfor %}
    ];

    markers.forEach(function (talk) {
      L.marker([talk.lat, talk.lon])
        .addTo(map)
        .bindPopup("<a href='" + talk.url + "'><strong>" + talk.title + "</strong></a>");
    });
  });
</script>
