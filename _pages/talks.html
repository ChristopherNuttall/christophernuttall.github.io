author_profile: true

<h2>Map of Talks</h2>

<!-- Ensure height with inline AND block styling -->
<style>
  #talks-map {
    height: 500px;
    width: 100%;
    margin-bottom: 2em;
    border: 1px solid #ccc;
  }
</style>

<div id="talks-map"></div>

{% for post in site.talks reversed %}
  {% include archive-single-talk.html %}
{% endfor %}

<!-- Leaflet CSS -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
/>

<!-- Leaflet JS -->
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const map = L.map("talks-map").setView([50, 20], 4);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);

    const markers = [
      {% assign has_marker = false %}
      {% for post in site.talks %}
        {% if post.latitude and post.longitude %}
          {% if has_marker %},{% endif %}
          {
            title: {{ post.title | jsonify }},
            lat: {{ post.latitude }},
            lon: {{ post.longitude }},
            url: {{ post.url | jsonify }}
          }
          {% assign has_marker = true %}
        {% endif %}
      {% endfor %}
    ];

    markers.forEach(function (talk) {
      L.marker([talk.lat, talk.lon])
        .addTo(map)
        .bindPopup(`<a href="${talk.url}"><strong>${talk.title}</strong></a>`);
    });
  });
</script>
